name: Bright Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  bright-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'
      - name: Install dependencies
        run: npm install
      - name: Run security tests
        env:
          BRIGHT_AUTH_ID: ${{ secrets.BRIGHT_AUTH_ID }}
        run: |
          npx bright scan --auth-id "$BRIGHT_AUTH_ID"
